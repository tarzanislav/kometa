name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rozhranie:
    name: Rozhranie (typy, zostavenie, zhoda s kometa/webui)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Kontrola a zostavenie
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Preložené rozhranie zodpovedá zdrojom
        run: |
          if [ -n "$(git status --porcelain -- kometa/webui)" ]; then
            git status --short -- kometa/webui
            echo "::error::kometa/webui nezodpovedá ui/ – spusti v priečinku ui príkaz npm run build a zmenu pridaj do commitu."
            exit 1
          fi

  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Závislosti
        run: python -m pip install -r requirements.txt pyflakes
      - name: Kontrola kódu
        run: python -m pyflakes app.py kometa tests
      - name: Skúška nového rozhrania
        run: python tests/test_webapp.py

  jadro:
    name: Jadro v Ruste (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jadro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Zostavenie a skúšky
        run: |
          cargo build --locked
          cargo test --locked
      - name: Úprava a kontrola kódu
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Streamy HLS/DASH, vlastné spájanie MKV/MP4 a skener stránok (FFmpeg len na prípravu a kontrolu)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          (cd jadro && cargo build --release --locked)
          python3 tests/test_jadro_streamy.py
          python3 tests/test_jadro_spajanie.py
          python3 tests/test_jadro_web.py
      - name: Služba pre okno – front, účty, yt-dlp a rozhranie v Chromiu (kometa okno)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          python3 -m pip install --user -q yt-dlp requests playwright
          python3 -m playwright install --with-deps chromium
          python3 tests/test_jadro_okno.py

  aplikacia:
    name: Aplikácia Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verzia aplikácie = verzia Komety
        shell: bash
        run: |
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' kometa/__init__.py)
          app=$(sed -n 's/^version = "\(.*\)"/\1/p' aplikacia/Cargo.toml | head -1)
          echo "Kometa $py, aplikácia $app"
          if [ "$py" != "$app" ]; then echo "::error::Verzia v aplikacia/Cargo.toml ($app) sa líši od kometa/__init__.py ($py)."; exit 1; fi
      - name: WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - name: Zostavenie aplikácie
        run: cargo build --locked -p kometa-aplikacia
      - name: Kontrola kódu aplikácie
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p kometa-aplikacia --all-targets -- -D warnings
