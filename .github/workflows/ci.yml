name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rozhranie:
    name: Rozhranie (typy, zostavenie, zhoda s kometa/webui)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Kontrola a zostavenie
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Preložené rozhranie zodpovedá zdrojom
        run: |
          if [ -n "$(git status --porcelain -- kometa/webui)" ]; then
            git status --short -- kometa/webui
            echo "::error::kometa/webui nezodpovedá ui/ – spusti v priečinku ui príkaz npm run build a zmenu pridaj do commitu."
            exit 1
          fi

  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Závislosti
        run: python -m pip install -r requirements.txt pyflakes
      - name: Kontrola kódu
        run: python -m pyflakes app.py kometa tests
      - name: Skúška nového rozhrania
        run: python tests/test_webapp.py

  jadro:
    name: Jadro v Ruste (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jadro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Zostavenie a skúšky
        run: |
          cargo build --locked
          cargo test --locked
      - name: Skutočné streamy HLS a DASH a vlastné spájanie MKV/MP4 (FFmpeg len na prípravu a kontrolu)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          (cd jadro && cargo build --release --locked)
          python3 tests/test_jadro_streamy.py
          python3 tests/test_jadro_spajanie.py
