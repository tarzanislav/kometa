[package]
name = "kometa-aplikacia"
version = "1.12.0"
edition = "2021"
description = "Kometa – aplikácia s vlastným jadrom v Ruste (Tauri)"
license = "MIT"
repository = "https://github.com/tarzanislav/kometa"
rust-version = "1.80"
publish = false

[[bin]]
name = "kometa-aplikacia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kometa-jadro = { path = "../jadro" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
