[package]
name = "kometa-jadro"
version = "0.4.0"
edition = "2021"
description = "Kometa – vlastné jadro na sťahovanie: HTTP po úsekoch s pokračovaním, HLS, DASH"
license = "MIT"
repository = "https://github.com/tarzanislav/kometa"
rust-version = "1.80"

[lib]
name = "kometa_jadro"
path = "src/lib.rs"

[[bin]]
name = "kometa"
path = "src/main.rs"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset", "cookies"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
roxmltree = "0.20"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
getrandom = "0.2"
trash = "5"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
