[workspace.package]
# verzia vydania Komety – jediný zdroj (aplikácia, jadro, postup vydania)
version = "2.0.3"

[workspace]
resolver = "2"
members = ["jadro", "aplikacia"]
# bežné `cargo build` zostaví len jadro (aplikácia potrebuje WebView – WebKitGTK na Linuxe)
default-members = ["jadro"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
